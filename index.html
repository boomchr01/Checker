<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS SG Drift Detector (Robust Parser)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f5f7; color: #333; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { color: #232f3e; margin-top: 0; display: flex; align-items: center; justify-content: space-between; }
        .badge-secure { background-color: #e6ffed; color: #1e7e34; font-size: 12px; padding: 4px 8px; border-radius: 4px; border: 1px solid #c3e6cb; font-weight: normal; }
        .upload-section { display: flex; gap: 20px; margin-bottom: 20px; padding: 15px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 6px; }
        .file-input { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        input[type="file"] { background: #fff; padding: 5px; border: 1px dashed #ccc; border-radius: 4px; }
        button { background-color: #ff9900; color: #232f3e; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.3s; width: 100%; }
        button:hover { background-color: #e38900; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 10px 12px; text-align: left; }
        th { background-color: #232f3e; color: #fff; }
        .status-added { background-color: #e6ffed; border-left: 4px solid #28a745; }
        .status-removed { background-color: #ffeef0; border-left: 4px solid #dc3545; }
        .badge-add { background: #28a745; color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-del { background: #dc3545; color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        #summary { margin-top: 20px; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>
        AWS Security Group Drift Detector
        <span class="badge-secure">🔒 Client-Side Processing</span>
    </h2>
    <p style="font-size: 13px; color: #666; margin-top: -10px;">ข้อมูลทั้งหมดถูกประมวลผลบนเบราว์เซอร์ของคุณ ไม่มีการอัปโหลดไฟล์ไปที่ Server</p>
    
    <div class="upload-section">
        <div class="file-input">
            <label for="baselineCsv"><strong>1. Baseline CSV (ไฟล์เดิม)</strong></label>
            <input type="file" id="baselineCsv" accept=".csv">
        </div>
        <div class="file-input">
            <label for="currentCsv"><strong>2. Current CSV (ไฟล์ปัจจุบัน)</strong></label>
            <input type="file" id="currentCsv" accept=".csv">
        </div>
    </div>
    
    <button id="compareBtn">Compare Security Groups</button>

    <div id="summary"></div>
    
    <div style="overflow-x: auto;">
        <table id="resultTable" style="display:none;">
            <thead>
                <tr id="tableHeader">
                    <!-- Headers will be generated dynamically -->
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Results will be injected here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // อ่านไฟล์เข้า Memory เครื่อง
    function readFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = (e) => reject(e);
            reader.readAsText(file);
        });
    }

    // ฟังก์ชัน Parse CSV ขั้นสูง (Robust CSV Parser)
    function parseCSV(text) {
        let arr = [];
        let quote = false;
        let row = 0, col = 0;
        
        // กวาดทีละตัวอักษรเพื่อรักษาความถูกต้องของข้อมูลที่มีลูกน้ำ (,) ซ่อนอยู่
        for (let c = 0; c < text.length; c++) {
            let cc = text[c], nc = text[c+1];
            arr[row] = arr[row] || [];
            arr[row][col] = arr[row][col] || '';
            
            // จัดการ Quote ซ้อน Quote
            if (cc === '"' && quote && nc === '"') { arr[row][col] += cc; ++c; continue; }
            // เปิด/ปิด Quote
            if (cc === '"') { quote = !quote; continue; }
            // ขึ้นคอลัมน์ใหม่ (ถ้าไม่ได้อยู่ใน Quote)
            if (cc === ',' && !quote) { ++col; continue; }
            // ขึ้นบรรทัดใหม่ (รองรับทั้ง \r\n, \n, \r)
            if (cc === '\r' && nc === '\n' && !quote) { ++row; col = 0; ++c; continue; }
            if (cc === '\n' && !quote) { ++row; col = 0; continue; }
            if (cc === '\r' && !quote) { ++row; col = 0; continue; }
            
            arr[row][col] += cc;
        }

        // กรองบรรทัดขยะที่ไม่มีข้อมูลจริงๆ ออกไป
        arr = arr.filter(r => r.join('').trim() !== '');
        
        if (arr.length === 0) return { header: [], rows: [], fingerprints: [] };
        
        // ล้างช่องว่างหัวท้ายของทุกคอลัมน์
        const header = arr[0].map(h => h.trim());
        const rows = arr.slice(1).map(row => row.map(cell => cell.trim()));
        
        // สร้าง Fingerprint ให้เป็นตัวพิมพ์เล็กทั้งหมดเพื่อใช้เทียบให้แม่นยำ
        const fingerprints = rows.map(row => row.join('|').toLowerCase());
        
        return { header, rows, fingerprints };
    }

    // ฟังก์ชันหลักทำงานเมื่อกดปุ่ม
    async function processFiles() {
        const baselineFile = document.getElementById('baselineCsv').files[0];
        const currentFile = document.getElementById('currentCsv').files[0];

        if (!baselineFile || !currentFile) {
            alert('กรุณาเลือกไฟล์ CSV ให้ครบทั้งสองช่องครับ');
            return;
        }

        try {
            const baselineText = await readFile(baselineFile);
            const currentText = await readFile(currentFile);

            const baselineData = parseCSV(baselineText);
            const currentData = parseCSV(currentText);

            if(baselineData.header.length === 0 || currentData.header.length === 0) {
                alert('รูปแบบไฟล์ CSV ไม่ถูกต้อง หรือไฟล์ว่างเปล่า');
                return;
            }

            renderHeader(baselineData.header);

            // นำ Fingerprint มาใส่ใน Set แทนการใช้บรรทัดดิบๆ
            const baselineSet = new Set(baselineData.fingerprints);
            const currentSet = new Set(currentData.fingerprints);

            const addedRules = [];
            const removedRules = [];

            // หา Rule ที่เพิ่มใหม่
            currentData.fingerprints.forEach((fingerprint, index) => {
                if (!baselineSet.has(fingerprint)) {
                    addedRules.push(currentData.rows[index]);
                }
            });

            // หา Rule ที่ถูกลบออก
            baselineData.fingerprints.forEach((fingerprint, index) => {
                if (!currentSet.has(fingerprint)) {
                    removedRules.push(baselineData.rows[index]);
                }
            });

            renderResults(addedRules, removedRules);

        } catch (error) {
            console.error("Error processing files:", error);
            alert("เกิดข้อผิดพลาดในการอ่านไฟล์ โปรดลองอีกครั้ง");
        }
    }

    // ฟังก์ชันวาดหัวตาราง
    function renderHeader(headers) {
        const headerRow = document.getElementById('tableHeader');
        headerRow.innerHTML = '<th style="width: 120px;">Change Status</th>';
        headers.forEach(header => {
            const th = document.createElement('th');
            th.textContent = header;
            headerRow.appendChild(th);
        });
    }

    // ฟังก์ชันวาดผลลัพธ์ลงตาราง
    function renderResults(added, removed) {
        const table = document.getElementById('resultTable');
        const tbody = document.getElementById('tableBody');
        const summary = document.getElementById('summary');
        tbody.innerHTML = '';

        if (added.length === 0 && removed.length === 0) {
            summary.innerHTML = '<span style="color: #1e7e34; font-weight: bold;">✅ No drift detected. Security Groups match perfectly.</span>';
            table.style.display = 'none';
            return;
        }

        summary.innerHTML = `⚠️ <b>Drift Detected:</b> <span class="badge-add">+${added.length} Added</span> <span class="badge-del">-${removed.length} Removed</span>`;
        table.style.display = 'table';

        // แสดงบรรทัดที่เพิ่ม
        added.forEach(row => {
            const tr = document.createElement('tr');
            tr.className = 'status-added';
            let html = `<td><span class="badge-add">ADDED</span></td>`;
            row.forEach(cell => { html += `<td>${cell}</td>`; });
            tr.innerHTML = html;
            tbody.appendChild(tr);
        });

        // แสดงบรรทัดที่ลบ
        removed.forEach(row => {
            const tr = document.createElement('tr');
            tr.className = 'status-removed';
            let html = `<td><span class="badge-del">REMOVED</span></td>`;
            row.forEach(cell => { html += `<td>${cell}</td>`; });
            tr.innerHTML = html;
            tbody.appendChild(tr);
        });
    }

    // ลงทะเบียน Event เข้ากับปุ่มหลังจากเว็บโหลดเสร็จ
    document.getElementById('compareBtn').addEventListener('click', processFiles);
</script>

</body>
</html>

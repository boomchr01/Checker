<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AWS SG Drift Detector</title>
<style>
body { font-family: Tahoma, sans-serif; padding: 20px; background: #f4f5f7; }
.container { max-width: 1000px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
textarea { width: 100%; height: 120px; margin-bottom: 15px; padding: 10px; font-family: monospace; box-sizing: border-box; }
button { padding: 12px 20px; background: #ff9900; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 14px; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
th { background-color: #232f3e; color: #fff; }
.added { background-color: #e6ffed; border-left: 4px solid #28a745; }
.removed { background-color: #ffeef0; border-left: 4px solid #dc3545; }
</style>
</head>
<body>
<div class="container">
<h2 style="margin-top:0;">SG Drift Detector (Copy-Paste Version) <span style="float: right; font-size: 12px; color: #888; font-weight: normal; margin-top: 8px;">v1.1</span></h2>

<b>1. ข้อมูลเดิม (Baseline)</b>
<textarea id="box1" placeholder="ก๊อปปี้ข้อมูลจากไฟล์เดิมมาวาง..."></textarea>

<b>2. ข้อมูลปัจจุบัน (Current)</b>
<textarea id="box2" placeholder="ก๊อปปี้ข้อมูลจากไฟล์ปัจจุบันมาวาง..."></textarea>

<!-- ปุ่มนี้จะถูกเปลี่ยนชื่อโดย JS ถ้าอนุญาตให้รัน -->
<button id="runBtn" onclick="window.runCompare()">กำลังตรวจสอบสิทธิ์ JS...</button>

<div id="resultText" style="margin-top:15px; font-weight:bold;"></div>
<table id="resultTable" style="display:none;">
<thead id="tHead"></thead>
<tbody id="tBody"></tbody>
</table>
</div>

<script>
// 1. ทันทีที่โหลดไฟล์ ถ้าบรรทัดนี้ทำงาน ชื่อปุ่มต้องเปลี่ยน
document.getElementById('runBtn').innerText = "Compare Security Groups";
document.getElementById('runBtn').style.backgroundColor = "#28a745";
document.getElementById('runBtn').style.color = "#fff";

// 2. ฟังก์ชันตรวจสอบ (ยัดเข้า Global Scope ตรงๆ)
window.runCompare = function() {
var txt1 = document.getElementById('box1').value.trim();
var txt2 = document.getElementById('box2').value.trim();

if(txt1 === "" || txt2 === "") {
alert("แจ้งเตือน: กรุณาวางข้อมูลให้ครบทั้ง 2 ช่อง");
return;
}

var lines1 = txt1.split(/\r?\n/).filter(function(l) { return l.trim() !== ''; });
var lines2 = txt2.split(/\r?\n/).filter(function(l) { return l.trim() !== ''; });

var separator = lines1[0].indexOf('\t') !== -1 ? '\t' : ',';
var headers = lines1[0].split(separator);

// --- ส่วนที่แก้ไข: สร้างฟังก์ชัน Normalize เพื่อทำความสะอาดบรรทัด ---
function normalizeLine(line) {
    // ลบเครื่องหมายคำพูด (") และตัด Space หัวท้ายออกทั้งหมด แล้วแปลงเป็นตัวเล็ก
    return line.replace(/["']/g, '').trim().toLowerCase();
}

// ใช้ .map() เพื่อสร้าง Array ของบรรทัดที่คลีนแล้ว
var normLines1 = lines1.map(normalizeLine);
var normLines2 = lines2.map(normalizeLine);

// เอาบรรทัดที่คลีนแล้ว (ไม่รวม Header) ไปใส่ Set เพื่อหาความต่าง
var set1 = new Set(normLines1.slice(1));
var set2 = new Set(normLines2.slice(1));
// -----------------------------------------------------------

var added = [];
var removed = [];

// ตรวจสอบ Added โดยเทียบจากตัวแปรที่คลีนแล้ว (normLines2 และ normLines1)
for (var i = 1; i < lines2.length; i++) {
    // ถ้าบรรทัดคลีนๆ ของอันใหม่ ไม่มีอยู่ใน Set อันเก่า แสดงว่าเพิ่งเพิ่มมา
    if (!set1.has(normLines2[i])) {
        // เวลาเก็บผลลัพธ์ ยังคงใช้เส้นดิบ (lines2) เผื่อแสดงผล
        added.push(lines2[i].split(separator));
    }
}

// ตรวจสอบ Removed
for (var j = 1; j < lines1.length; j++) {
    if (!set2.has(normLines1[j])) {
        removed.push(lines1[j].split(separator));
    }
}

var rText = document.getElementById('resultText');
var rTable = document.getElementById('resultTable');
var tHead = document.getElementById('tHead');
var tBody = document.getElementById('tBody');

if(added.length === 0 && removed.length === 0) {
rText.innerHTML = "<span style='color:green;'>✅ ไม่พบการเปลี่ยนแปลง (Rule ตรงกัน 100%)</span>";
rTable.style.display = 'none';
return;
}

rText.innerHTML = "⚠️ พบการเปลี่ยนแปลง: <span style='color:green;'>เพิ่ม " + added.length + " บรรทัด</span>, <span style='color:red;'>ลบ " + removed.length + " บรรทัด</span>";
rTable.style.display = 'table';

var headHtml = "<tr><th>Status</th>";
for(var h = 0; h < headers.length; h++) headHtml += "<th>" + headers[h].replace(/["']/g,'') + "</th>";
headHtml += "</tr>";
tHead.innerHTML = headHtml;

var bodyHtml = "";
for(var a = 0; a < added.length; a++) 
{
bodyHtml += "<tr class='added'><td><b>+ ADDED</b></td>";
for(var c = 0; c < added[a].length; c++) bodyHtml += "<td>" + added[a][c].replace(/["']/g,'') + "</td>";
bodyHtml += "</tr>";
}
for(var r = 0; r < removed.length; r++) {
bodyHtml += "<tr class='removed'><td><b>- REMOVED</b></td>";
for(var d = 0; d < removed[r].length; d++) bodyHtml += "<td>" + removed[r][d].replace(/["']/g,'') + "</td>";
bodyHtml += "</tr>";
}
tBody.innerHTML = bodyHtml;
};
</script>
</body>
</html>
